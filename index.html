<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<style>html,body{margin:0}</style>
<title>赤い屋根の家の骨組み</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EDEFEE; --panel:#F8F9F8; --ink:#1D2528; --muted:#5B676B; --line:#D3D8D7;
  --accent:#C0392B; --accent-soft:#F6E1DC; --scene:#E6EAE3; --ground:#D6DAD0;
  --chip:#E6EAE9; --plan-bg:#FFFFFF; --plan-wall:#1D2528; --plan-faint:#B9C1C0;
  --shadow:0 1px 2px rgba(20,30,32,.06),0 8px 24px rgba(20,30,32,.08);
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121718; --panel:#192022; --ink:#E3E8E7; --muted:#98A4A6; --line:#2C3538;
    --accent:#E0685A; --accent-soft:#3A2522; --scene:#1C2629; --ground:#2B3234;
    --chip:#232B2D; --plan-bg:#EEF0EE; --plan-wall:#1D2528; --plan-faint:#B9C1C0;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121718; --panel:#192022; --ink:#E3E8E7; --muted:#98A4A6; --line:#2C3538;
  --accent:#E0685A; --accent-soft:#3A2522; --scene:#1C2629; --ground:#2B3234;
  --chip:#232B2D; --plan-bg:#EEF0EE; --plan-wall:#1D2528; --plan-faint:#B9C1C0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr)}
.top{grid-column:1/-1;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.top h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.04em}
.top .sub{color:var(--muted);font-size:12.5px}
.top .spec{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.viewcol{display:flex;flex-direction:column;min-height:0;min-width:0}
#viewer{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--scene);touch-action:none}
#c{display:block;width:100%;height:100%;cursor:grab}
#c:active{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none}
.rl{position:absolute;transform:translate(-50%,-50%);font-size:11.5px;font-weight:500;white-space:nowrap;padding:2px 8px 2px 6px;border-radius:4px;background:color-mix(in srgb,var(--panel) 88%,transparent);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12);display:flex;align-items:center;gap:6px}
.rl i{width:9px;height:9px;border-radius:2px;display:inline-block;border:1px solid rgba(0,0,0,.15)}
.rl.hot{background:var(--ink);color:var(--panel)}
.bar{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:space-between;align-items:center;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.stepbar{display:flex;flex-wrap:wrap;gap:2px}
.pill{font:inherit;font-size:12.5px;font-weight:500;border:0;background:none;color:var(--ink);padding:4px 9px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pill:hover{background:var(--chip)}
.pill .no{font-family:var(--mono);font-size:11px;color:var(--muted)}
.pill[aria-current="step"]{background:var(--accent);color:#fff}
.pill[aria-current="step"] .no{color:rgba(255,255,255,.8)}
.pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hud{display:flex;gap:6px;flex-wrap:wrap}
.stepbar .sep{align-self:stretch;border-left:1px solid var(--line);margin:2px 6px}
.pill.playpill{background:#B3321F;color:#fff;font-weight:700}
.pill.playpill:hover{background:#9A2A19}
.pill.playpill .pl{font-size:10px}
.pill.playpill.playing{background:#1D2528}
.pill.wpill{color:#A33A26}
.pill.wpill[aria-current="step"]{color:#fff}
.ml{position:absolute;transform:translate(14px,-50%);pointer-events:none;background:var(--ink);color:var(--panel);font-size:12px;font-weight:500;padding:4px 10px;border-radius:4px;white-space:nowrap;box-shadow:var(--shadow)}
.ml b{color:#F08A6E;font-weight:700;margin-right:6px}
.tg{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:5px 10px;border-radius:6px;cursor:pointer}
.tg[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tg:focus-visible,.step:focus-visible,.nav button:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{position:absolute;left:10px;bottom:8px;transition:opacity .6s;pointer-events:none;font-size:11px;color:var(--muted);background:color-mix(in srgb,var(--panel) 80%,transparent);padding:3px 8px;border-radius:4px}
.err{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);padding:24px;text-align:center}
.panel{background:var(--panel);border-left:1px solid var(--line);min-height:0;overflow:auto}
.detail{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--mono);font-size:11.5px;color:var(--accent);letter-spacing:.06em}
.detail h2{margin:2px 0 6px;font-size:19px;line-height:1.4;text-wrap:balance}
.detail p{margin:0;max-width:62ch}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips span{font-family:var(--mono);font-size:11px;background:var(--chip);color:var(--muted);padding:2px 8px;border-radius:4px}
.plan{padding:14px 20px 16px;border-bottom:1px solid var(--line)}
.planhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.planhead h3{margin:0;font-size:13px;font-weight:700;letter-spacing:.08em}
.planhead .note{font-size:11px;color:var(--muted)}
.seg{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-family:var(--mono);font-size:12px;background:var(--panel);color:var(--muted);border:0;padding:3px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
#planSvg{display:block;width:100%;height:auto;background:var(--plan-bg);border-radius:6px;border:1px solid var(--line)}
#planSvg .room{cursor:pointer;transition:filter .15s}
#planSvg .room:hover,#planSvg .room.hot{filter:brightness(.88) saturate(1.4)}
#planSvg text{font-family:var(--sans);fill:#1D2528;pointer-events:none}
.nav{display:flex;gap:8px;padding:12px 20px;border-bottom:1px solid var(--line)}
.nav button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer}
.nav button.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.nav button:disabled{opacity:.4;cursor:default}
.nav .grow{flex:1}
.steps{list-style:none;margin:0;padding:8px 12px 16px}
.step{width:100%;text-align:left;font:inherit;background:none;border:0;color:var(--ink);display:grid;grid-template-columns:30px 1fr;gap:2px 10px;align-items:start;padding:8px;border-radius:6px;cursor:pointer}
.step:hover{background:var(--chip)}
.step .no{font-family:var(--mono);font-size:12px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted)}
.step .t{font-weight:500;line-height:1.45;padding-top:2px}
.step .s{grid-column:2;font-size:12px;color:var(--muted);line-height:1.5}
.step[aria-current="step"]{background:var(--accent-soft)}
.step[aria-current="step"] .no{background:var(--accent);border-color:var(--accent);color:#fff}
@media (max-width:900px){
  .app{display:block;height:auto}
  .top .spec{margin-left:0;width:100%}
  .viewcol{display:block}
  #viewer{height:60vh;min-height:340px}
  .panel{border-left:0;overflow:visible}
}
</style>

<div class="app">
  <header class="top">
    <h1>赤い屋根の家の骨組み</h1>
    <span class="sub">間取り図から起こした木造2階建て（在来軸組工法）</span>
    <span class="spec">910 MODULE / 1F 13,650×8,190 / 2F 5,460×5,915 / 寄棟</span>
  </header>
  <main class="viewcol">
    <div class="bar">
      <div class="stepbar" id="steps" role="group" aria-label="表示の切り替え"></div>
      <div class="hud">
        <button class="tg" id="tgSkin" aria-pressed="true">屋根・外壁</button>
        <button class="tg" id="tgRooms" aria-pressed="true">部屋名</button>
        <button class="tg" id="tgSite" aria-pressed="true">外構</button>
      </div>
    </div>
    <div id="viewer" aria-label="3Dビューア">
      <canvas id="c"></canvas>
      <div id="labels"></div>
      <div class="hint" id="hint">ドラッグで回転 ／ ホイール・ピンチで拡大 ／ 右ドラッグ・2本指で移動</div>
    </div>
  </main>
  <aside class="panel">
    <div class="detail" aria-live="polite">
      <div class="eyebrow" id="dEyebrow"></div>
      <h2 id="dTitle"></h2>
      <p id="dBody"></p>
      <div class="chips" id="dChips"></div>
    </div>
    <section class="plan" aria-label="平面図">
      <div class="planhead">
        <h3>平面図</h3><span class="note">部屋にカーソルを合わせると3Dで光ります</span>
        <div class="seg" role="group" aria-label="階の切り替え">
          <button id="pl1" aria-pressed="true">1F</button><button id="pl2" aria-pressed="false">2F</button>
        </div>
      </div>
      <svg id="planSvg" viewBox="-2.6 -1.9 18.8 14.4" role="img" aria-label="平面図"></svg>
    </section>
    <div class="nav">
      <button id="prev">← 前へ</button>
      <button id="replay" hidden>▶ 最初から流す</button>
      <span class="grow"></span>
      <button id="next" class="primary">次へ →</button>
    </div>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.137.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.137.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
(function () {
'use strict';
var viewer = document.getElementById('viewer');
if (typeof THREE === 'undefined') {
  viewer.insertAdjacentHTML('beforeend', '<div class="err">3Dライブラリを読み込めませんでした。ネットワーク接続を確認して再読み込みしてください。</div>');
  return;
}
var V3 = THREE.Vector3, UP = new V3(0, 1, 0);
var M = 0.91;
function g(v) { return v * M; }
// 高さ（m）
var Y = { fd: 0.40, dodai: 0.505, f1: 0.53, beamB: 2.62, beamT: 2.86, joistT: 2.905, f2: 2.93, plateB: 5.30, plateT: 5.48 };
var EAVE = 0.6, P1 = 0.4, P2 = 0.5;
var H1 = Y.beamT + 0.06, H2 = Y.plateT + 0.06;   // 壁芯位置の屋根面高さ

/* ---------------- renderer / scene ---------------- */
var canvas = document.getElementById('c');
var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(38, 1, 0.05, 200);
if (THREE.RoomEnvironment) {
  var pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
  renderer.userData = {};
}
function lin(hex) { return new THREE.Color(hex).convertSRGBToLinear(); }
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
scene.add(new THREE.HemisphereLight(0xf5f5f2, 0xc9c5bb, 0.58));
var sun = new THREE.DirectionalLight(0xfff3e6, 1.15);
sun.position.set(-6, 16, 16); sun.target.position.set(6.8, 1, 5);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
var sc = sun.shadow.camera; sc.left = -13; sc.right = 13; sc.top = 13; sc.bottom = -13; sc.near = 1; sc.far = 50;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun); scene.add(sun.target);
var groundMat = new THREE.MeshStandardMaterial({ roughness: 1, envMapIntensity: 0.3 });
var ground = new THREE.Mesh(new THREE.CircleGeometry(60, 64), groundMat);
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
function applyTheme() {
  var s = lin(cssVar('--scene') || '#DCE8EE');
  scene.background = s; renderer.setClearColor(s); scene.fog = new THREE.Fog(s, 40, 95);
  groundMat.color = lin(cssVar('--ground') || '#CBD2C6');
}
applyTheme();
try {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
} catch (e) {}

/* ---------------- 模様つきマテリアル（ブロック・レンガ・瓦・雨戸） ---------------- */
function patternMat(hex, o) {
  var m = new THREE.MeshStandardMaterial({ color: lin(hex), roughness: o.rough || 0.85, metalness: o.metal || 0, envMapIntensity: o.env || 0.18, side: o.side || THREE.FrontSide });
  m.onBeforeCompile = function (sh) {
    sh.uniforms.uPtSize = { value: new THREE.Vector2(o.w || 0, o.h || 0.1) };
    sh.uniforms.uPtLine = { value: o.line || 0.08 };
    sh.uniforms.uPtDark = { value: o.dark || 0.25 };
    sh.vertexShader = 'varying vec3 vPtW;\nvarying vec3 vPtN;\n' + sh.vertexShader.replace('#include <begin_vertex>',
      '#include <begin_vertex>\nvPtW = (modelMatrix * vec4(transformed, 1.0)).xyz;\nvPtN = normalize(mat3(modelMatrix) * objectNormal);');
    sh.fragmentShader = 'uniform vec2 uPtSize;\nuniform float uPtLine;\nuniform float uPtDark;\nvarying vec3 vPtW;\nvarying vec3 vPtN;\n' +
      sh.fragmentShader.replace('#include <color_fragment>', [
        '#include <color_fragment>',
        'float ptS = abs(vPtN.x) > abs(vPtN.z) ? vPtW.z : vPtW.x;',
        'float ptRow = floor(vPtW.y / uPtSize.y);',
        'float ptL = step(1.0 - uPtLine, fract(vPtW.y / uPtSize.y));',
        'if (uPtSize.x > 0.0) ptL = max(ptL, step(1.0 - uPtLine * uPtSize.y / uPtSize.x, fract(ptS / uPtSize.x + 0.5 * mod(ptRow, 2.0))));',
        'diffuseColor.rgb *= 1.0 - uPtDark * ptL;'
      ].join('\n'));
  };
  m.customProgramCacheKey = function () { return 'pt'; };
  return m;
}

/* ---------------- 骨組み部材 ---------------- */
var MATS = {};
function mat(key, hex, o) { MATS[key] = new THREE.MeshStandardMaterial(Object.assign({ color: lin(hex), roughness: 0.8, envMapIntensity: 0.55 }, o || {})); }
mat('found', '#B9B6AE', { roughness: 0.95 }); mat('dodai', '#8E6A47'); mat('post', '#D8B583'); mat('stud', '#E6D0A6');
mat('beam', '#C39862'); mat('joist', '#DABF93'); mat('lintel', '#E0C28F'); mat('rafter', '#CDA36D');
mat('hip', '#AE8150'); mat('purlin', '#BF935C'); mat('stair', '#CFA874'); mat('rail', '#D8B583');

var parts = {};
function push(grp, type, m) { (parts[grp] = parts[grp] || {}); (parts[grp][type] = parts[grp][type] || []).push(m); }
function box(grp, type, x0, y0, z0, x1, y1, z1) {
  var m = new THREE.Matrix4();
  m.compose(new V3((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2), new THREE.Quaternion(), new V3(Math.abs(x1 - x0), Math.abs(y1 - y0), Math.abs(z1 - z0)));
  push(grp, type, m);
}
function beam(grp, type, a, b, w, h) {
  var d = new V3().subVectors(b, a), len = d.length();
  if (len < 0.02) return;
  d.normalize();
  var side = new V3().crossVectors(UP, d); if (side.lengthSq() < 1e-6) side.set(1, 0, 0); side.normalize();
  var up = new V3().crossVectors(d, side).normalize();
  var m = new THREE.Matrix4().makeBasis(side, up, d); m.scale(new V3(w, h, len));
  m.setPosition(new V3().addVectors(a, b).multiplyScalar(0.5));
  push(grp, type, m);
}
function along(grp, type, s, y0, y1, w, inset) {
  var e = inset ? -0.0525 : w / 2;
  if (s[1] === s[3]) { var a = Math.min(s[0], s[2]), b = Math.max(s[0], s[2]); box(grp, type, g(a) - e, y0, g(s[1]) - w / 2, g(b) + e, y1, g(s[1]) + w / 2); }
  else { var c = Math.min(s[1], s[3]), d = Math.max(s[1], s[3]); box(grp, type, g(s[0]) - w / 2, y0, g(c) - e, g(s[0]) + w / 2, y1, g(d) + e); }
}
function onSeg(px, pz, s) {
  var E = 1e-6;
  if (s[1] === s[3]) return Math.abs(pz - s[1]) < E && px >= Math.min(s[0], s[2]) - E && px <= Math.max(s[0], s[2]) + E;
  return Math.abs(px - s[0]) < E && pz >= Math.min(s[1], s[3]) - E && pz <= Math.max(s[1], s[3]) + E;
}
function ring(poly) { var r = []; for (var i = 0; i < poly.length; i++) { var a = poly[i], b = poly[(i + 1) % poly.length]; r.push([a[0], a[1], b[0], b[1], 1]); } return r; }

/* ---------------- 間取り（グリッド = 910mm、上が北・下が道路側） ---------------- */
var EXT1 = [[0, 0], [15, 0], [15, 4.5], [12, 4.5], [12, 9], [4, 9], [4, 4.5], [0, 4.5]];
var EXT2 = [[6, 1], [12, 1], [12, 7.5], [6, 7.5]];
var W1 = ring(EXT1).concat([
  [0, 1, 5, 1, 0], [2, 0, 2, 1, 0], [5, 0, 5, 4.5, 0], [10.5, 0, 10.5, 4.5, 0], [12, 0, 12, 4.5, 0],
  [12, 3, 15, 3, 0], [14, 3, 14, 4.5, 0], [4, 4.5, 12, 4.5, 0], [9, 4.5, 9, 9, 0], [10.5, 4.5, 10.5, 7.5, 0], [9, 7.5, 12, 7.5, 0]
]);
var W2 = ring(EXT2).concat([[6, 4, 10, 4, 0], [10, 1, 10, 7.5, 0], [10, 3, 12, 3, 0]]);
var XB = [[6, 1, 12, 1], [6, 1, 6, 7.5], [6, 7.5, 9, 7.5], [6, 4, 10, 4], [10, 1, 10, 7.5], [10, 3, 12, 3], [8, 1, 8, 7.5]];
// 開口部 t: win / haki（掃き出し）/ door / shut（雨戸）
var OPEN = [
  { lv: 1, a: [5.2, 9], b: [8.5, 9], t: 'haki', sill: null, head: 2.35, tob: -1 },
  { lv: 1, a: [10, 9], b: [11, 9], t: 'door', sill: null, head: 2.35 },
  { lv: 1, a: [11.3, 9], b: [11.8, 9], t: 'win', sill: 1.6, head: 2.35 },
  { lv: 1, a: [1, 4.5], b: [3.5, 4.5], t: 'shut', sill: 1.0, head: 2.35 },
  { lv: 1, a: [0, 1.2], b: [0, 3.2], t: 'haki', sill: null, head: 2.35, tob: 1 },
  { lv: 1, a: [4, 5], b: [4, 8.5], t: 'win', sill: 0.95, head: 2.2 },
  { lv: 1, a: [6, 0], b: [8, 0], t: 'win', sill: 1.4, head: 2.35, tob: 1 },
  { lv: 1, a: [11, 0], b: [11.8, 0], t: 'win', sill: 1.6, head: 2.35 },
  { lv: 1, a: [13, 0], b: [14, 0], t: 'win', sill: 1.6, head: 2.35 },
  { lv: 1, a: [15, 1], b: [15, 2], t: 'win', sill: 1.6, head: 2.35 },
  { lv: 1, a: [12, 5.5], b: [12, 6.5], t: 'win', sill: 1.6, head: 2.35 },
  { lv: 2, a: [7.6, 7.5], b: [9.2, 7.5], t: 'win', sill: 3.62, head: 4.83, tob: -1 }, // 戸袋＋窓をバルコニーの中央に
  { lv: 2, a: [10.6, 7.5], b: [11.4, 7.5], t: 'win', sill: 3.83, head: 4.83 },

(function () {
  var m = /^#s(\d)$/.exec(location.hash || '');
  if (!m || !STAGES[+m[1]]) return;
  resize(); setStage(+m[1]); Object.assign(cur, goal); animating = false;
  if (STAGES[+m[1]].water) for (var fi = 0; fi < 1500; fi++) updateWater(1 / 60);
})();
requestAnimationFrame(function () { resize(); }); // 初回レイアウト確定後にアスペクト比を確実に反映
requestAnimationFrame(tick);
window.__house = { setStage: setStage, frame: frame, cur: cur, goal: goal, WS: WS, flow: leakFlow, playLeak: playLeak, autoplay: autoplay, stage: function () { return stage; } };
})();
</script>
